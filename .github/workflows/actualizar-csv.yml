name: Actualizar CSV

on:
  repository_dispatch:
    types: [actualizar-csv]

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descargar CSV desde URL de OneDrive/SharePoint
        run: |
          # 1. Obtener la URL institucional desde el payload
          URL_ORIGINAL="${{ github.event.client_payload.csv_url }}"
          
          # 2. Limpiar parámetros web y añadir la bandera de descarga directa de Microsoft
          URL_LIMPIA=$(echo "$URL_ORIGINAL" | sed 's/?.*//')
          URL_DESCARGA="${URL_LIMPIA}?download=1"
          
          # 3. Descargar el archivo procesando redirecciones (-L)
          curl -L "$URL_DESCARGA" -o datos.csv

      - name: Verificar descarga
        run: |
          echo "Filas esperadas: ${{ github.event.client_payload.row_count }}"
          if [ -f datos.csv ]; then
            wc -l datos.csv
          else
            echo "Error: El archivo datos.csv no se descargó correctamente."
            exit 1
          fi

      - name: Commit y Push
        run: |
          git config user.name "Power Automate"
          git config user.email "automate@example.com"
          git add datos.csv
          # Realiza el commit solo si hay cambios en el archivo para evitar romper el flujo
          git commit -m "Actualizar CSV desde Power Automate - ${{ github.event.client_payload.timestamp }}" || echo "Sin cambios"
          git push
