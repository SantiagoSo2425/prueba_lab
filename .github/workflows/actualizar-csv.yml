name: Actualizar CSV

on:
  repository_dispatch:
    types: [actualizar-csv]

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descargar CSV desde OneDrive Personal (Excel Link)
        run: |
          # 1. Obtener la URL enviada por Power Automate
          URL_ORIGINAL="${{ github.event.client_payload.csv_url }}"
          
          # 2. Transformar la estructura de edición interactiva de Excel en descarga directa
          # Reemplaza /x/c/ por /download/ y añade el parámetro de descarga automatizada
          URL_DESCARGA=$(echo "$URL_ORIGINAL" | sed 's/\/x\/c\//\/download\//')
          
          # 3. Descargar el archivo crudo (.csv) usando curl
          curl -L "$URL_DESCARGA" -o datos.csv

      - name: Verificar descarga
        run: |
          echo "Filas esperadas: ${{ github.event.client_payload.row_count }}"
          if [ -f datos.csv ]; then
            echo "--- Primeras líneas del archivo descargado ---"
            head -n 5 datos.csv
            echo "---------------------------------------------"
            echo "Total de líneas obtenidas:"
            wc -l datos.csv
          else
            echo "Error: El archivo datos.csv no se pudo generar."
            exit 1
          fi

      - name: Commit y Push
        run: |
          git config user.name "Power Automate"
          git config user.email "automate@example.com"
          git add datos.csv
          git commit -m "Actualizar CSV desde Power Automate - ${{ github.event.client_payload.timestamp }}" || echo "Sin cambios"
          git push
