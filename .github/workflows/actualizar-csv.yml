name: Actualizar CSV

on:
  repository_dispatch:
    types: [actualizar-csv]

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ver payload
        run: echo '${{ toJson(github.event.client_payload) }}'

      - name: Descargar CSV desde URL
        run: |
          curl -L "${{ github.event.client_payload.csv_url }}" -o datos.csv

      - name: Verificar descarga
        run: |
          echo "Filas esperadas: ${{ github.event.client_payload.row_count }}"
          wc -l datos.csv

      - name: Commit y Push
        run: |
          git config user.name "Power Automate"
          git config user.email "automate@example.com"
          git add datos.csv
          git commit -m "Actualizar CSV desde Power Automate - ${{ github.event.client_payload.timestamp }}" || echo "Sin cambios"
          git push
