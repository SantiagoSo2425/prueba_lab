name: Actualizar CSV

on:
  repository_dispatch:
    types: [actualizar-csv]

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descargar CSV desde OneDrive Personal
        run: |
          # 1. Obtener la URL personal desde el payload
          URL_ORIGINAL="${{ github.event.client_payload.csv_url }}"
          
          # 2. Convertir la URL a formato Base64 seguro para la API pública de OneDrive
          URL_BASE64=$(echo -n "$URL_ORIGINAL" | base64 -w0 | tr -d '=' | tr '/+' '_-')
          
          # 3. Descargar el contenido crudo del archivo (.csv)
          curl -sL "https://onedrive.com{URL_BASE64}/root/content" -o datos.csv

      - name: Verificar descarga
        run: |
          echo "Filas esperadas: ${{ github.event.client_payload.row_count }}"
          if [ -f datos.csv ]; then
            # Muestra las primeras líneas para asegurar que sea texto CSV y no HTML de error
            head -n 5 datos.csv
            echo "Total de líneas obtenidas:"
            wc -l datos.csv
          else
            echo "Error: El archivo datos.csv no se descargó correctamente."
            exit 1
          fi

      - name: Commit y Push
        run: |
          git config user.name "Power Automate"
          git config user.email "automate@example.com"
          git add datos.csv
          # Evita errores si el archivo no sufrió cambios reales
          git commit -m "Actualizar CSV desde Power Automate - ${{ github.event.client_payload.timestamp }}" || echo "Sin cambios"
          git push
